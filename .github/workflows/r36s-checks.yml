name: R36S ARM64 source checks (no game data)
on:
  push:
    branches: [port/r36s-portmaster]
  pull_request:
  workflow_dispatch:
jobs:
  cross-compiler-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 C and C++ cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Verify both C and C++ objects target AArch64 (no ROMs)
        run: |
          mkdir -p /tmp/ki-cross-check
          cat > /tmp/ki-cross-check/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ki_cross_compiler_check LANGUAGES C CXX)
          add_library(c_object STATIC c_object.c)
          add_library(cpp_object STATIC cpp_object.cpp)
          EOF
          echo 'int ki_c_check(void) { return 4; }' > /tmp/ki-cross-check/c_object.c
          echo 'int ki_cpp_check() { return 8; }' > /tmp/ki-cross-check/cpp_object.cpp
          cmake -S /tmp/ki-cross-check -B /tmp/ki-cross-check/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          cmake --build /tmp/ki-cross-check/build --parallel 2
          readelf -h /tmp/ki-cross-check/build/CMakeFiles/c_object.dir/c_object.c.o | grep 'Machine:.*AArch64'
          readelf -h /tmp/ki-cross-check/build/CMakeFiles/cpp_object.dir/cpp_object.cpp.o | grep 'Machine:.*AArch64'
          bash -n tools/r36s/build.sh
  native-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libsdl2-dev
      - name: Build guest-independent runtime self-test
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKI_BUILD_FULL=OFF -DKI_R36S=ON
          cmake --build build-ci --target runtime_selftest dcs_fastmem_selftest dsp_hotspot_selftest dsp_waitloop_selftest adsp_native_selftest kinst_vblank_fast_selftest mfc0_inline_selftest mips_idle_skip_selftest mips_memory_fast_selftest host_profiler_selftest gfx_profile_selftest --parallel 2
          ctest --test-dir build-ci --output-on-failure
      - name: Verify GNU ld circular archive link fix without game data
        run: |
          cmake -S tests/r36s_link_smoke -B build-link-smoke -G Ninja
          cmake --build build-link-smoke --parallel 2
          ctest --test-dir build-link-smoke --output-on-failure
      - name: Compile R36S SDL player translation units (syntax-only)
        run: |
          c++ -std=c++20 -fsyntax-only -DKI_R36S=1 -Iruntime/include -Ithird_party/adsp2100 -Isrc $(sdl2-config --cflags) src/ki_play.cpp src/ki_pad.cpp src/ki_pad_ui.cpp
      - name: Check PortMaster packaging scripts and metadata
        run: |
          bash -n tools/r36s/build.sh
          bash -n "tools/r36s/portmaster/Killer Instinct Arcade.sh"
          bash -n tools/r36s/diagnose.sh
          python3 -m py_compile tools/r36s/package_port.py tools/r36s/prepare_data.py tools/r36s/generate_adsp_native.py tools/kirecomp/idle_patterns.py
          python3 tools/kirecomp/idle_patterns.py
          python3 tools/r36s/prepare_data.py --help >/dev/null
          python3 -m json.tool tools/r36s/portmaster/port.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("tools/r36s/portmaster")
          d=json.loads((p/"port.json").read_text())
          assert d["version"]==4 and d["attr"]["arch"]==["aarch64"]
          assert d["items"]==["Killer Instinct Arcade.sh","killerinstinct"]
          assert (p/"gameinfo.xml").exists()
          print("Prototype PortMaster metadata: OK (not a public submission)")
          PY

      - name: Verify GNU ld circular archive link fix without game data
        run: |
          cmake -S tests/r36s_link_smoke -B build-link-smoke -G Ninja
